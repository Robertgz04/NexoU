name: Deploy NexoU API
on:
  push:
    branches: [master]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: nexou-production
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Download repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Verify deployment recovery
        run: python3 deploy/tests/rollback.test.py
      - name: Deploy latest master to server
        env:
          DEPLOY_KEY: ${{ secrets.NEXOU_DEPLOY_SSH_KEY }}
          DEPLOY_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$DEPLOY_KEY" ]; then
            echo 'Falta el secret NEXOU_DEPLOY_SSH_KEY en Settings > Secrets and variables > Actions.' >&2
            exit 1
          fi
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_KEY" > ~/.ssh/nexou_deploy
          chmod 600 ~/.ssh/nexou_deploy
          trap 'rm -f ~/.ssh/nexou_deploy' EXIT
          ssh -T -i ~/.ssh/nexou_deploy \
            -o IdentitiesOnly=yes -o BatchMode=yes -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile=deploy/known_hosts \
            -o ConnectTimeout=20 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 \
            root@62.146.172.2 "deploy $DEPLOY_SHA"
      - name: Verify public API
        run: curl --fail --silent --show-error --retry 5 --retry-delay 3 https://nexou-api.avorainc.com/health
